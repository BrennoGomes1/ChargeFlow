services:
  - type: web
    name: chargeflow-api
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "1440"
      - key: CORS_ORIGINS
        value: "https://chargeflow-usuario.onrender.com,https://chargeflow-admin.onrender.com"

  - type: web
    name: chargeflow-usuario
    env: static
    staticPublishPath: frontend/usuario
    buildCommand: ""

  - type: web
    name: chargeflow-admin
    env: static
    staticPublishPath: frontend/admin
    buildCommand: ""
